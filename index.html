<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POLRAD Sandbox Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#171a23; --panel:#1c212c; --panel2:#232a3a; --panel3:#2c3345; --border:#343d52;
    --text:#eef1f7; --sub:#8891a5; --accent:#3254ad; --accent2:#e0526a; --good:#35c98c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #map{position:absolute;inset:0;background:var(--bg);}
  #langRow{
    position:fixed;top:14px;left:14px;z-index:1200;
    display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);
    border-radius:8px;padding:3px;box-shadow:0 4px 14px #0007;
  }
  .langBtn{
    background:transparent;border:0;color:var(--sub);font-family:inherit;
    font-size:11px;font-weight:600;padding:5px 9px;border-radius:5px;cursor:pointer;
  }
  .langBtn.active{background:var(--accent);color:#fff;}

  /* Advance bar — Divgen-style strip at the bottom */
  #advanceBar{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1200;
    width:min(920px,calc(100% - 60px));
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 6px 24px #0009;
    display:none;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    min-height:46px;
  }
  #advanceBar.open{display:flex;}
  .navBtn{
    flex:0 0 32px;width:32px;height:32px;padding:0;border-radius:6px;
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .12s,border-color .12s;
  }
  .navBtn:hover:not(:disabled){background:var(--panel3);border-color:var(--accent);}
  .navBtn:disabled{opacity:.3;cursor:default;}
  #advanceText{
    flex:1;min-width:0;font-size:13.5px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #advanceArea{
    flex:0 0 auto;font-size:12.5px;font-weight:700;
    padding:4px 10px;border-radius:6px;white-space:nowrap;
  }
  #advanceArea.red{background:#e0526a22;color:#e0526a;border:1px solid #e0526a;}
  #advanceArea.blue{background:#3254ad22;color:#4a72f5;border:1px solid #3254ad;}
  #advanceArea.neutral{background:var(--panel2);color:var(--sub);border:1px solid var(--border);}
  #advanceDate{
    flex:0 0 auto;font-size:12.5px;color:var(--sub);
    display:flex;align-items:center;gap:6px;padding:0 4px;
    border-left:1px solid var(--border);padding-left:10px;
  }
  #advanceDate svg{opacity:.7;}
  #advanceCount{
    flex:0 0 auto;font-size:11px;color:var(--sub);
    padding-left:8px;border-left:1px solid var(--border);
  }

  /* When the sidebar-scale bar isn't shown, keep the small map default view */
  .leaflet-control-scale-line{
    background:var(--panel)!important;color:var(--text)!important;
    border:1px solid var(--border)!important;border-top:none!important;
    box-shadow:0 2px 8px #0006;border-radius:0 0 4px 4px;
  }
  .leaflet-control-zoom a{
    background:var(--panel) !important;color:var(--text) !important;border-color:var(--border) !important;
  }
  .leaflet-control-zoom a:hover{
    background:var(--panel2) !important;color:var(--text) !important;
  }
  .leaflet-popup.polygon-edit-popup .leaflet-popup-content-wrapper{
    background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;
  }
  .leaflet-popup.polygon-edit-popup .leaflet-popup-content{margin:10px 12px;}
  .leaflet-popup.polygon-edit-popup .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup.polygon-edit-popup .leaflet-popup-close-button{color:var(--sub) !important;}

  #map3d{position:absolute;inset:0;z-index:1;display:none;background:#0a0e14;}
  #map3d.active{display:block;}
</style>
</head>
<body>

<div id="map"></div>
<div id="map3d"></div>

<div id="langRow">
  <button class="langBtn active" id="langEn">EN</button>
  <button class="langBtn" id="langRu">RU</button>
</div>

<div id="advanceBar">
  <button class="navBtn" id="advPrev" title="Previous advance">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div id="advanceText">Loading advances…</div>
  <div id="advanceArea" class="neutral"></div>
  <div id="advanceDate">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
    <span id="advanceDateText">—</span>
  </div>
  <button class="navBtn" id="advNext" title="Next advance">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div id="advanceCount"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  /* =================================================================
     Sandbox map v2
     - Reads russia.geojson + grayzone.geojson from polrad-ma/version
     - Reads advances.json and drives the bottom advance bar
     - Clicking ◀ ▶ swaps russia + grayzone to that advance's snapshot
     - EN / RU toggle for the description text
     - No terrain, no 3D, no draw tools — this file is just the bar test
     ================================================================= */

  const RAW_ROOT = "https://raw.githubusercontent.com/polrad-ma/version/main/";
  const ADVANCES_URL = RAW_ROOT + "advances.json";
  const RUSSIA_URL = RAW_ROOT + "russia.geojson";
  const GRAYZONE_URL = RAW_ROOT + "grayzone.geojson";

  const LAYERS = [
    { key: "russia",   name: "Russian-controlled territory", color: "#a52714", outline: "#ff0000", pane: "territoryPane" },
    { key: "grayzone", name: "Gray Zone",                    color: "#c3c3c3", outline: "#b4b4b4", pane: "grayZonePane" }
  ];

  const map = L.map("map", {
    center: [48.00, 37.75],
    zoom: 7,
    scrollWheelZoom: true,
    zoomControl: false,
    preferCanvas: true
  });

  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.control.scale({ position: "bottomleft", metric: true, imperial: true, maxWidth: 150 }).addTo(map);

  map.createPane("territoryPane");
  map.getPane("territoryPane").style.zIndex = 420;
  map.createPane("grayZonePane");
  map.getPane("grayZonePane").style.zIndex = 460;

  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { attribution: "Tiles © Esri", maxZoom: 19 }
  ).addTo(map);
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    { attribution: "Labels © Esri", maxZoom: 19 }
  ).addTo(map);

  /* ---- State ---- */
  const liveData = { russia: null, grayzone: null };  // fetched once from version repo
  const geoLayers = {};                                // current Leaflet layer per key
  let advances = [];
  let advIndex = -1;
  let currentLang = "en";

  function makeGeoLayer(key, geojson) {
    const info = LAYERS.find(l => l.key === key);
    return L.geoJSON(geojson, {
      pane: info.pane,
      smoothFactor: 2.0,
      style: {
        color: info.outline,
        fillColor: info.color,
        fillOpacity: 0.4,
        weight: 2
      },
      onEachFeature: (feature, layer) => {
        if (feature.geometry && (feature.geometry.type === "Polygon" || feature.geometry.type === "MultiPolygon")) {
          layer.on("click", e => {
            L.popup({ className: "polygon-edit-popup" })
              .setLatLng(e.latlng)
              .setContent("<b>" + info.name + "</b>")
              .openOn(map);
          });
        }
      }
    });
  }

  function setLayerData(key, geojson) {
    if (geoLayers[key]) map.removeLayer(geoLayers[key]);
    geoLayers[key] = makeGeoLayer(key, geojson);
    geoLayers[key].addTo(map);
  }

  function clearAllLayers() {
    LAYERS.forEach(l => {
      if (geoLayers[l.key]) {
        map.removeLayer(geoLayers[l.key]);
        geoLayers[l.key] = null;
      }
    });
  }

  /* ---- Load live files + advances.json ---- */
  async function loadAll() {
    const bust = "?v=" + Date.now();
    const fetches = LAYERS.map(l => {
      const url = l.key === "russia" ? RUSSIA_URL : GRAYZONE_URL;
      return fetch(url + bust, { cache: "no-store" })
        .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status))
        .then(d => { liveData[l.key] = d; })
        .catch(err => { console.warn("Could not load " + l.key + ":", err); liveData[l.key] = null; });
    });

    await Promise.all(fetches);

    // Draw the live layers
    LAYERS.forEach(l => {
      if (liveData[l.key]) setLayerData(l.key, liveData[l.key]);
    });

    // Fetch advances list
    try {
      const r = await fetch(ADVANCES_URL + bust, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const list = await r.json();
      if (Array.isArray(list)) {
        advances = list;
        // Sort by date+time ascending so ◀ goes backward in time
        advances.sort((a, b) => {
          const ak = String(a.date || "") + "T" + String(a.time || "00:00:00");
          const bk = String(b.date || "") + "T" + String(b.time || "00:00:00");
          return ak.localeCompare(bk);
        });
      }
    } catch (e) {
      console.warn("Could not load advances.json:", e);
      advances = [];
    }

    if (advances.length) {
      advIndex = advances.length - 1; // default to latest
      document.getElementById("advanceBar").classList.add("open");
      applyAdvanceState();
    } else {
      document.getElementById("advanceBar").classList.remove("open");
    }
  }

  /* ---- Advance bar ---- */
  const advPrevBtn = document.getElementById("advPrev");
  const advNextBtn = document.getElementById("advNext");
  const advTextEl = document.getElementById("advanceText");
  const advAreaEl = document.getElementById("advanceArea");
  const advDateEl = document.getElementById("advanceDateText");
  const advCountEl = document.getElementById("advanceCount");

  function pickText(item) {
    if (!item) return "";
    if (currentLang === "ru") return item.text_ru || item.text_en || item.text || "";
    return item.text_en || item.text || item.text_ru || "";
  }

  function pickAreaDisplay(item) {
    if (!item) return "";
    return item.areaDisplay || "";
  }

  function pickAreaColor(item) {
    if (!item) return "neutral";
    if (item.areaColor === "blue") return "blue";
    if (item.areaColor === "red") return "red";
    // fallbacks from effects if areaColor is absent
    const eff = Array.isArray(item.areaEffects) ? item.areaEffects[0] : null;
    if (eff) return eff.side === "ua" ? "blue" : "red";
    return item.side === "ua" ? "blue" : "red";
  }

  async function applyAdvanceState() {
    const item = advances[advIndex];
    if (!item) return;

    // Bar contents
    advTextEl.textContent = pickText(item);
    const areaText = pickAreaDisplay(item);
    advAreaEl.textContent = areaText;
    advAreaEl.className = pickAreaColor(item);
    advAreaEl.style.display = areaText ? "" : "none";
    advDateEl.textContent = item.date || "—";
    advCountEl.textContent = (advIndex + 1) + " / " + advances.length;

    advPrevBtn.disabled = advIndex <= 0;
    advNextBtn.disabled = advIndex >= advances.length - 1;

    // Load the snapshot for this advance and swap russia/grayzone
    if (item.snapshot) {
      const snapUrl = RAW_ROOT + item.snapshot;
      try {
        const r = await fetch(snapUrl + "?v=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const snap = await r.json();
        // The editor writes { "russia": fc, "grayzone": fc } or
        // { "Russian-controlled territory": fc, "Gray Zone": fc }
        const ruFc = snap["russia"] || snap["Russian-controlled territory"] || null;
        const gzFc = snap["grayzone"] || snap["Gray Zone"] || null;

        clearAllLayers();
        if (ruFc) setLayerData("russia", ruFc);
        if (gzFc) setLayerData("grayzone", gzFc);
      } catch (e) {
        console.warn("Could not load advance snapshot:", e);
      }
    }
  }

  advPrevBtn.onclick = () => { if (advIndex > 0) { advIndex--; applyAdvanceState(); } };
  advNextBtn.onclick = () => { if (advIndex < advances.length - 1) { advIndex++; applyAdvanceState(); } };

  /* ---- Language toggle ---- */
  document.getElementById("langEn").onclick = () => {
    currentLang = "en";
    document.getElementById("langEn").classList.add("active");
    document.getElementById("langRu").classList.remove("active");
    if (advIndex >= 0) applyAdvanceState();
  };
  document.getElementById("langRu").onclick = () => {
    currentLang = "ru";
    document.getElementById("langRu").classList.add("active");
    document.getElementById("langEn").classList.remove("active");
    if (advIndex >= 0) applyAdvanceState();
  };

  /* ---- Go ---- */
  loadAll();

</script>
</body>
</html>
